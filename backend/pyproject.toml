[project]
name = "insight-engine-backend"
version = "0.1.0"
description = "Backend for Insight Engine — clean messy CSVs, answer NL queries"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pandas>=2.2",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "rapidfuzz>=3.10",
    "httpx>=0.27",
    "anthropic>=0.40",
    "huggingface-hub>=0.26",
    "pydantic>=2.9",
]

[tool.uv]
package = false
